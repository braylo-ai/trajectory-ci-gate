task_id: refund_large
nodes:
  order:
    tool: get_order
    args:
      order_id: A300
  customer:
    tool: lookup_customer
    args:
      customer_id:
        ref: order.result.customer
  verify:
    tool: verify_identity
    args:
      customer_id:
        ref: customer.result.customer_id
      method:
        in:
        - email_otp
        - sms_otp
  policy:
    tool: check_refund_policy
    args:
      order_id: A300
      amount:
        ref: order.result.amount
  escalate:
    tool: escalate_to_human
    args:
      order_id: A300
      reason:
        any: true
  email:
    tool: send_email
    args:
      to:
        ref: customer.result.email
      template: refund_pending_review
edges:
- - order
  - customer
- - customer
  - verify
- - order
  - policy
- - verify
  - escalate
- - policy
  - escalate
- - escalate
  - email
forbidden:
- issue_refund
allow_extra: false
max_calls:
  issue_refund: 1
max_steps: 8
