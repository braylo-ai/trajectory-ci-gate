name: trajectory-gate
on: [pull_request, push]
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e . pytest && pytest -q
      - name: Record sample-agent trajectories
        run: python -m sample_agent.agent main runs scenarios
      - name: Gate
        uses: ./
        with:
          golden: golden
          runs: runs
